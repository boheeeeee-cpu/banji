<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>반지 지도</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .banji-marker-pin {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 16px 16px 16px 4px;
        background: #ff6b8a;
        border: 2px solid #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        transform: rotate(-45deg);
      }
      .banji-marker-pin span {
        transform: rotate(45deg);
        display: block;
      }
      .banji-marker-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ff6b8a;
        border: 2.5px solid #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        opacity: 0.9;
        cursor: pointer;
      }
      .banji-marker-dot:hover {
        opacity: 1;
        transform: scale(1.3);
      }
      .auth-error {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, sans-serif;
        color: #60646c;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
    <script>
      function postAuthFailure() {
        var payload = JSON.stringify({ type: 'authFailure' });
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(payload);
        } else if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      window.navermap_authFailure = function () {
        postAuthFailure();
        document.body.innerHTML =
          '<div class="auth-error">네이버 지도 인증에 실패했습니다.<br/>등록된 Web 서비스 URL을 확인해 주세요.</div>';
      };

      function onBanjiMapEmbedReady() {
        if (!window.BanjiMapBridge) {
          setTimeout(onBanjiMapEmbedReady, 50);
          return;
        }
        window.BanjiMapBridge.init('map');
      }
    </script>
    <script src="/banji-map-bridge.js"></script>
    <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=6jiib06wvc&callback=onBanjiMapEmbedReady"></script>
  </head>
  <body>
    <div id="map"></div>
  </body>
</html>
